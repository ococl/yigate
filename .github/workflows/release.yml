name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  test:
    name: Quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: ./src/go.sum

      - name: Download dependencies
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go mod download

      - name: Mod verify
        run: go mod verify

      - name: Test
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go test ./...

      - name: Race detector
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go test -race ./...

      - name: Vet
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          working-directory: ./src

      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
          work-dir: ./src

      - name: Check release configs
        working-directory: .
        run: ./scripts/check-release-configs.sh

  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: ./src/go.sum

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Build release
        run: ./scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Check release files
        run: ./scripts/check-release-files.sh "${GITHUB_REF_NAME#v}"

      - name: Smoke test Linux binary
        run: ./release/k5pw-${GITHUB_REF_NAME#v}-linux-amd64 -version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: release/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/k5pw-*
            release/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
