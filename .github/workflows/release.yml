name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: ./src/go.sum

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: ./web/package-lock.json

      - name: Frontend unit tests
        working-directory: ./web
        run: |
          npm ci
          npm audit --audit-level=high --registry=https://registry.npmjs.org
          npm test

      - name: Download dependencies
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go mod download

      - name: Mod verify
        run: go mod verify

      - name: Test
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go test ./...

      - name: Race detector
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go test -race ./...

      - name: Vet
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: ./src

      - name: Vulnerability scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-package: ./...
          work-dir: ./src

      - name: Check release configs
        working-directory: .
        run: ./scripts/check-release-configs.sh

      - name: Install Playwright Chromium
        working-directory: .
        run: make web-e2e-install

      - name: Browser E2E
        working-directory: .
        run: make web-e2e

  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: ./src/go.sum

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: ./web/package-lock.json

      - name: Validate Docker Compose files
        run: |
          docker compose -f deploy/docker/compose.local.yml config --quiet
          docker compose -f deploy/docker/compose.lan.yml config --quiet

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VERSION="${GITHUB_REF_NAME#v}" \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f deploy/docker/Dockerfile \
            -t yigate:release-check .

      - name: Build release
        run: ./scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Check release files
        run: ./scripts/check-release-files.sh "${GITHUB_REF_NAME#v}"

      - name: Smoke test Linux archive
        run: |
          smoke_dir="${RUNNER_TEMP}/yigate-smoke"
          rm -rf "${smoke_dir}"
          mkdir -p "${smoke_dir}"
          tar -xzf "release/yigate-${GITHUB_REF_NAME#v}-linux-amd64.tar.gz" -C "${smoke_dir}"
          "${smoke_dir}/yigate" -version

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: release/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            release/yigate-*
            release/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
