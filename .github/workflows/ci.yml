name: CI

# GitHub 仅作为镜像仓库：代码与产物由 CNB 流水线同步推送，
# 所有质量门禁在 CNB（.cnb.yml）执行，GitHub 侧不触发任何自动构建。
# 这里保留同一份矩阵配置供 scripts/check-platforms-sync.sh 校验平台一致性，
# 同时保留手动入口，便于在 GitHub 上做一次性排查。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: ./src/go.sum

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: ./web/package-lock.json

      - name: Build and embed WebUI
        working-directory: .
        run: make web-install web-embed

      - name: Download dependencies
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go mod download

      - name: Test with coverage
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go test -coverprofile=coverage.out ./...

      - name: Coverage threshold
        run: bash ../scripts/check-coverage.sh 70 coverage.out

      - name: Race detector
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOPROXY: https://goproxy.cn,direct
        with:
          version: v2.15.0
          working-directory: ./src
          # 与 CNB 一致：用 setup-go 的 Go 1.27.3 现场编译，避免预编译二进制
          # 因 Go 版本低于 go.mod 目标版本而无法加载配置。
          install-mode: goinstall

      - name: Vulnerability scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-package: ./...
          work-dir: ./src

      - name: Vet
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go vet ./...

      - name: Build native binary
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go build -o yigate .

  webui:
    name: WebUI tests
    runs-on: ubuntu-latest
    needs: test
    env:
      GOPROXY: https://goproxy.cn,direct
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: ./src/go.sum

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: ./web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Frontend type check
        run: cd web && npm run type-check

      - name: Frontend source checks
        run: cd web && npm run check

      - name: Frontend dependency audit
        run: cd web && npm audit --audit-level=high

      - name: Platform list consistency
        run: bash scripts/check-platforms-sync.sh

      - name: Release config check
        run: bash scripts/check-release-configs.sh

      - name: Vitest unit tests
        run: make web-test

      - name: Install Playwright Chromium
        run: make web-e2e-install

      # Chromium 默认不带中文字体，缺失时截图与断言文案会渲染成方框。
      - name: Install CJK fonts for E2E
        run: bash scripts/install-e2e-fonts.sh

      - name: Playwright browser E2E
        run: make web-e2e

      - name: Management API regression
        run: bash scripts/run-management-api-e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

  cross-compile:
    name: Cross compile
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/386
          - linux/arm/v7
          - linux/arm/v6
          - linux/riscv64
          - linux/ppc64le
          - linux/s390x
          - linux/mips64
          - linux/mips64le
          - linux/mips
          - linux/mipsle
          - linux/loong64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - windows/386
          - windows/arm64
          - freebsd/amd64
          - freebsd/386
          - freebsd/arm64
          - freebsd/arm/v7
          - openbsd/amd64
          - openbsd/arm64
          - netbsd/amd64
          - netbsd/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: ./src/go.sum

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: ./web/package-lock.json

      - name: Build and embed WebUI
        working-directory: .
        run: make web-install web-embed

      - name: Download dependencies
        env:
          GOPROXY: https://goproxy.cn,direct
        working-directory: ./src
        run: go mod download

      - name: Build
        env:
          GOPROXY: https://goproxy.cn,direct
          CGO_ENABLED: '0'
        working-directory: ./src
        shell: bash
        run: |
          IFS='/' read -r GOOS GOARCH GOARM <<< "${{ matrix.platform }}"
          export GOOS GOARCH
          export GOARM="${GOARM#v}"
          SUFFIX="${GOOS}-${GOARCH}"
          if [[ "$GOARCH" == "arm" && "$GOARM" == "7" ]]; then SUFFIX="${GOOS}-armv7"; fi
          OUTPUT="yigate-${SUFFIX}"
          if [[ "${GOOS}" == "windows" ]]; then OUTPUT="${OUTPUT}.exe"; fi
          go build -trimpath -mod=readonly -ldflags '-s -w' -o "${OUTPUT}" .

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yigate-build-${{ matrix.platform }}
          path: ./src/yigate-*
          if-no-files-found: error

  docker:
    name: Docker and config validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: ./src/go.sum

      - name: Check release configs
        run: ./scripts/check-release-configs.sh

      - name: Build local Docker image
        run: |
          docker build \
            --build-arg VERSION=ci --build-arg COMMIT=ci --build-arg BUILD_TIME=ci \
            -f deploy/docker/Dockerfile -t yigate:local .

      - name: Validate local compose
        run: |
          cd deploy/docker
          docker compose -f compose.local.yml config --quiet
          docker compose -f compose.lan.yml config --quiet
