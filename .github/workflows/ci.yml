name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: ./src/go.sum

      - name: Download dependencies
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go mod download

      - name: Test with coverage
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go test -coverprofile=coverage.out ./...

      - name: Race detector
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          working-directory: ./src

      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
          work-dir: ./src

      - name: Vet
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go vet ./...

      - name: Build native binary
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go build -o k5pw .

  cross-compile:
    name: Cross compile
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/386
          - linux/arm/v7
          - linux/riscv64
          - linux/ppc64le
          - linux/s390x
          - linux/mips64
          - linux/mips64le
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - windows/386
          - windows/arm64
          - freebsd/amd64
          - freebsd/386
          - freebsd/arm64
          - openbsd/amd64
          - openbsd/arm64
          - netbsd/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: ./src/go.sum

      - name: Download dependencies
        env:
          GOPROXY: https://goproxy.cn,direct
        working-directory: ./src
        run: go mod download

      - name: Build
        env:
          GOPROXY: https://goproxy.cn,direct
          CGO_ENABLED: '0'
        working-directory: ./src
        shell: bash
        run: |
          IFS='/' read -r GOOS GOARCH GOARM <<< "${{ matrix.platform }}"
          export GOOS GOARCH
          export GOARM="${GOARM#v}"
          SUFFIX="${GOOS}-${GOARCH}"
          if [[ "$GOARCH" == "arm" && "$GOARM" == "7" ]]; then SUFFIX="${GOOS}-armv7"; fi
          OUTPUT="k5pw-${SUFFIX}"
          if [[ "${GOOS}" == "windows" ]]; then OUTPUT="${OUTPUT}.exe"; fi
          go build -trimpath -mod=readonly -ldflags '-s -w' -o "${OUTPUT}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: k5pw-build-${{ matrix.platform }}
          path: ./src/k5pw-*
          if-no-files-found: error

  docker:
    name: Docker and config validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: ./src/go.sum

      - name: Check release configs
        run: ./scripts/check-release-configs.sh

      - name: Build local Docker image
        run: |
          docker build \
            --build-arg VERSION=ci --build-arg COMMIT=ci --build-arg BUILD_TIME=ci \
            -f deploy/docker/Dockerfile -t k5pw:local .

      - name: Validate local compose
        run: |
          cd deploy/docker
          docker compose -f compose.local.yml config --quiet
          docker compose -f compose.lan.yml config --quiet
