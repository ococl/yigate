version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    gosec:
      # 代理需读取/构造原始请求，以下规则易误报，按需调整。
      excludes:
        - G104 # 忽略未检查的错误（部分写操作错误仅记日志）
        - G114 # 使用 net/http 默认客户端仅用于 geosite 下载
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    # 与 v1 的 exclude-use-default 等价：保留社区通用的告警豁免，
    # 避免升级后因默认豁免集消失而产生大量历史噪音。
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # 测试文件中允许使用点导入与未导出检查的部分宽松规则；
      # bodyclose 保持 v1 行为（测试响应体由 helper 统一关闭，不逐处检查）。
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - gosec
      # G115: DNS/SOCKS 协议字段长度来自已校验的有界值（<=255 / <=65535），转换不会溢出。
      - text: "G115:"
        linters:
          - gosec
      # G704: 代理的核心职责就是连接运行期配置的上游地址，SSRF 属预期行为。
      - text: "G704:"
        linters:
          - gosec
      # G102: SOCKS5 BIND 按协议要求监听全部接口。
      - text: "G102:"
        linters:
          - gosec
      # G703: 配置写回路径来自启动参数而非请求输入，taint 分析误报。
      - path: config_api_impl\.go
        text: "G703:"
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
