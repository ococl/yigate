services:
  yigate:
    image: ${YIGATE_IMAGE:-docker.cnb.cool/yi.team/yigate:latest}
    container_name: yigate
    command: ["-config", "/var/lib/yigate/config/config.yml", "run"]
    ports:
      - "8891:8891"   # 代理端口（HTTP/HTTPS/SOCKS5 共用）
      - "127.0.0.1:8890:8890"  # 管理端口（WebUI + API，建议仅暴露到回环）
    volumes:
      - ./data:/var/lib/yigate/config:rw   # 配置文件目录（可写，首次启动自动生成默认配置）
      - ./yigate-data:/var/lib/yigate/data
      - ./yigate-logs:/var/log/yigate
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8890/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
