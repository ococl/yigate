# ===========================================================================
# YiGate CNB CI/CD 配置
#
# 流水线概览:
#   main 分支 push   → 完整 CI → Beta 构件 + Docker 镜像 :main（覆盖式）
#   v* tag push      → 完整 CI → 正式版（release, latest）+ Docker 镜像
#   PR to main|dev   → lint + test + 前端校验（不发布）
#
# 二进制产物（跨平台归档）与 Docker 镜像同时发布，互为补充。
# 版本方案详见 VERSIONING.md
# ===========================================================================

# ==================== main 分支: 每日构建 ====================
main:
  push:
    - name: beta
      docker:
        image: golang:1.27.3
        volumes:
          - /go/pkg/mod
      services:
        - docker
      env:
        GOPROXY: https://goproxy.cn,direct
        CGO_ENABLED: "0"
        YIGATE_REQUIRE_SBOM: "1"
      label:
        type: BETA
      stages:
        - name: lint
          script: cd src && go vet ./...
        - name: test
          script: cd src && go test -timeout 120s ./...
        - name: race
          # 流水线级 env 设置了 CGO_ENABLED=0，而 -race 依赖 cgo，必须在此显式覆盖。
          script: cd src && CGO_ENABLED=1 go test -race -timeout 180s ./...
        - name: webui-test
          image: node:26.13.0-alpine
          script: |
            cd web && npm ci && npm audit --audit-level=high --registry=https://registry.npmjs.org && npm test
        - name: check-release-configs
          script: bash scripts/check-release-configs.sh
        - name: determine-version
          script: |
            VERSION=$(bash scripts/version.sh)
            echo "Version: $VERSION"
            echo "##[set-output version=$VERSION]"
          exports:
            version: BUILD_VERSION
        - name: webui-build
          image: node:26.13.0-alpine
          script: |
            cd web && npm ci && npm run build && node scripts/embed-dist.mjs dist ../src/proxy/webui_dist
        - name: build
          script: |
            mkdir -p build
            (cd src && CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ../build/yigate-e2e .)
            bash scripts/ci-build.sh "$BUILD_VERSION"
        - name: webui-e2e
          image: mcr.microsoft.com/playwright:v1.65.0-noble
          script: |
            cd web && npm ci
            YIGATE_E2E_BIN="$PWD/../build/yigate-e2e" npm run test:e2e
        # main 是分支事件，没有对应的 Release，附件只能挂到 commit 上：
        # 不填 tag 时插件自动使用 $CNB_COMMIT（分支没有 Release，指定 tag 会 404）。
        - name: upload-artifacts
          image: cnbcool/attachments
          settings:
            attachments:
              - "./release/*.tar.gz"
              - "./release/*.zip"
              - "./release/*.spdx.json"
              - "./release/SHA256SUMS"
          allowFailure: false
        # ---- 每日构建镜像：每次 main 提交均触发，:main 标签覆盖式推送 ----
        # 正式 Docker 镜像 (:latest / :X.Y.Z) 仅由 v* tag 流水线发布。
        - name: docker-build
          script: docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:main -f deploy/docker/Dockerfile .
        - name: docker-push
          script: docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:main

# ==================== PR 检查: 代码质量守护 ====================
"(main|dev)":
  pull_request:
    - name: pr-check
      docker:
        image: golang:1.27.3
        volumes:
          - /go/pkg/mod
      env:
        GOPROXY: https://goproxy.cn,direct
      stages:
        - name: lint
          script: cd src && go vet ./...
        - name: test
          script: cd src && go test -timeout 120s ./...
        - name: race
          # 流水线级 env 设置了 CGO_ENABLED=0，而 -race 依赖 cgo，必须在此显式覆盖。
          script: cd src && CGO_ENABLED=1 go test -race -timeout 180s ./...
        - name: webui-test
          image: node:26.13.0-alpine
          script: |
            cd web && npm ci && npm audit --audit-level=high --registry=https://registry.npmjs.org && npm test
        - name: check-release-configs
          script: bash scripts/check-release-configs.sh
      failStages:
        - name: pr-check-failed
          script: echo "PR 检查未通过，请修复后重新提交"

# ==================== v* tag: 正式版发布 ====================
"v*":
  tag_push:
    - name: formal-release
      docker:
        image: golang:1.27.3
        volumes:
          - /go/pkg/mod
      services:
        - docker
      env:
        GOPROXY: https://goproxy.cn,direct
        CGO_ENABLED: "0"
        YIGATE_REQUIRE_SBOM: "1"
      label:
        type: RELEASE
      stages:
        - name: lint
          script: cd src && go vet ./...
        - name: golangci-lint
          image: golangci/golangci-lint:v2.15.0
          script: cd src && golangci-lint config verify && golangci-lint run
        - name: test
          script: cd src && go test -timeout 120s ./...
        - name: race
          # 流水线级 env 设置了 CGO_ENABLED=0，而 -race 依赖 cgo，必须在此显式覆盖。
          script: cd src && CGO_ENABLED=1 go test -race -timeout 180s ./...
        - name: vulnerability-scan
          script: |
            cd src
            go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
            export PATH="$(go env GOPATH)/bin:$PATH"
            govulncheck ./...
        - name: webui-test
          image: node:26.13.0-alpine
          script: |
            cd web && npm ci && npm audit --audit-level=high --registry=https://registry.npmjs.org && npm test
        - name: check-release-configs
          script: bash scripts/check-release-configs.sh
        - name: determine-version
          script: |
            VERSION=$(bash scripts/version.sh)
            echo "Version: $VERSION"
            echo "##[set-output version=$VERSION]"
          exports:
            version: BUILD_VERSION
        - name: webui-build
          image: node:26.13.0-alpine
          script: |
            cd web && npm ci && npm run build && node scripts/embed-dist.mjs dist ../src/proxy/webui_dist
        - name: build
          script: |
            mkdir -p build
            (cd src && CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ../build/yigate-e2e .)
            bash scripts/ci-build.sh "$BUILD_VERSION"
        - name: webui-e2e
          image: mcr.microsoft.com/playwright:v1.65.0-noble
          script: |
            cd web && npm ci
            YIGATE_E2E_BIN="$PWD/../build/yigate-e2e" npm run test:e2e
        - name: verify-release
          script: bash scripts/check-release-files.sh "$BUILD_VERSION"
        - name: generate-changelog
          image: cnbcool/changelog
          settings:
            latestChangeLogTarget: LATEST_CHANGELOG.md
        # ---- 先产出全部产物与镜像，再创建 Release，最后把产物挂到该 Release 上 ----
        # 注意：cnbcool/attachments 依赖已存在的 Release，顺序颠倒会 404。
        - name: docker-build
          script: |
            docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${BUILD_VERSION} -f deploy/docker/Dockerfile .
        - name: docker-push
          script: |
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${BUILD_VERSION}
        - name: create-release
          type: git:release
          options:
            title: YiGate
            descriptionFromFile: LATEST_CHANGELOG.md
            latest: true
        - name: upload-artifacts
          image: cnbcool/attachments
          settings:
            attachments:
              - "./release/*.tar.gz"
              - "./release/*.zip"
              - "./release/*.spdx.json"
              - "./release/SHA256SUMS"
          allowFailure: false
