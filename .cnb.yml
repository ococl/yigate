main:
  push:
    - services:
        - docker
      stages:
        # 同名镜像构建&推送（基于 deploy/docker/Dockerfile）
        - name: Docker build
          script: docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest -f deploy/docker/Dockerfile .
        - name: Docker push
          script: docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
