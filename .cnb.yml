# ===========================================================================
# YiGate CNB CI/CD 配置
#
# 流水线概览:
#   dev 分支 push    → 完整 CI → 早鸟预览版 (pre-release, 滚动 tag: dev-latest)
#   main 分支 push   → 完整 CI → Beta 版    (pre-release, 滚动 tag: beta-latest) + Docker 镜像
#   v* tag push      → 完整 CI → 正式版     (release, 标记为 latest) + Docker 镜像
#   PR to main|dev   → lint + test (代码质量守护)
#
# 二进制产物（跨平台归档）与 Docker 镜像同时发布，互为补充。
# 版本方案详见 VERSIONING.md
# ===========================================================================

# ==================== dev 分支: 早鸟预览版 ====================
dev:
  push:
    - name: early-bird-preview
      docker:
        image: golang:1.21
        volumes:
          - /go/pkg/mod          # Go 模块缓存
      env:
        GOPROXY: https://goproxy.cn,direct
        CGO_ENABLED: "0"
      label:
        type: EARLY_BIRD
      stages:
        - name: lint
          script: cd src && go vet ./...
        - name: test
          script: cd src && go test -timeout 120s ./...
        - name: determine-version
          script: |
            VERSION=$(bash scripts/version.sh)
            echo "Version: $VERSION"
            echo "##[set-output version=$VERSION]"
          exports:
            version: BUILD_VERSION
        - name: webui-build
          image: node:20-alpine
          script: |
            cd web && npm install && npm run build
        - name: build
          script: |
            rm -rf src/proxy/webui_dist && mkdir -p src/proxy/webui_dist && cp -r web/dist/* src/proxy/webui_dist/
            bash scripts/ci-build.sh "$BUILD_VERSION"
        - name: prepare-release-notes
          script: |
            cat > release/RELEASE_NOTES.md <<EOF
            早鸟预览版 (Early Bird Preview)

            版本: ${BUILD_VERSION}
            提交: ${CNB_COMMIT}
            构建时间: ${CNB_BUILD_START_TIME}

            此版本来自 dev 分支自动构建，仅供测试和预览，可能不稳定。
            运行 yigate -version 查看版本详情。
            EOF
        - name: create-rolling-tag
          script: |
            git config user.name "CNB CI"
            git config user.email "ci@cnb.cool"
            git tag -f "dev-latest"
            git push "https://${CNB_TOKEN_USER_NAME}:${CNB_TOKEN}@${CNB_REPO_URL_HTTPS#https://}" "dev-latest" -f
          allowFailure: true
        - name: create-release
          type: git:release
          options:
            tag: dev-latest
            title: YiGate Early Bird Preview
            descriptionFromFile: release/RELEASE_NOTES.md
            preRelease: true
            overlying: true
          allowFailure: true
        - name: clear-old-artifacts
          image: cnbcool/attachments
          settings:
            type: DELETE
            tag: dev-latest
          allowFailure: true
        - name: upload-artifacts
          image: cnbcool/attachments
          settings:
            tag: dev-latest
            attachments:
              - "./release/*.tar.gz"
              - "./release/*.zip"
              - "./release/SHA256SUMS"
          allowFailure: true

# ==================== main 分支: Beta 版 ====================
main:
  push:
    - name: beta
      docker:
        image: golang:1.21
        volumes:
          - /go/pkg/mod
      services:
        - docker
      env:
        GOPROXY: https://goproxy.cn,direct
        CGO_ENABLED: "0"
      label:
        type: BETA
      stages:
        - name: lint
          script: cd src && go vet ./...
        - name: test
          script: cd src && go test -timeout 120s ./...
        - name: determine-version
          script: |
            VERSION=$(bash scripts/version.sh)
            echo "Version: $VERSION"
            echo "##[set-output version=$VERSION]"
          exports:
            version: BUILD_VERSION
        - name: webui-build
          image: node:20-alpine
          script: |
            cd web && npm install && npm run build
        - name: build
          script: |
            rm -rf src/proxy/webui_dist && mkdir -p src/proxy/webui_dist && cp -r web/dist/* src/proxy/webui_dist/
            bash scripts/ci-build.sh "$BUILD_VERSION"
        - name: prepare-release-notes
          script: |
            cat > release/RELEASE_NOTES.md <<EOF
            Beta 版

            版本: ${BUILD_VERSION}
            提交: ${CNB_COMMIT}
            构建时间: ${CNB_BUILD_START_TIME}

            此版本来自 main 分支自动构建，接近正式发布但可能存在不稳定因素。
            运行 yigate -version 查看版本详情。
            EOF
        - name: create-rolling-tag
          script: |
            git config user.name "CNB CI"
            git config user.email "ci@cnb.cool"
            git tag -f "beta-latest"
            git push "https://${CNB_TOKEN_USER_NAME}:${CNB_TOKEN}@${CNB_REPO_URL_HTTPS#https://}" "beta-latest" -f
          allowFailure: true
        - name: create-release
          type: git:release
          options:
            tag: beta-latest
            title: YiGate Beta
            descriptionFromFile: release/RELEASE_NOTES.md
            preRelease: true
            overlying: true
          allowFailure: true
        - name: clear-old-artifacts
          image: cnbcool/attachments
          settings:
            type: DELETE
            tag: beta-latest
          allowFailure: true
        - name: upload-artifacts
          image: cnbcool/attachments
          settings:
            tag: beta-latest
            attachments:
              - "./release/*.tar.gz"
              - "./release/*.zip"
              - "./release/SHA256SUMS"
          allowFailure: true
        # ---- Docker 镜像发布（与二进制产物同时发布）----
        - name: docker-build
          script: docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:beta-latest -f deploy/docker/Dockerfile .
        - name: docker-push
          script: docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:beta-latest

# ==================== PR 检查: 代码质量守护 ====================
"(main|dev)":
  pull_request:
    - name: pr-check
      docker:
        image: golang:1.21
        volumes:
          - /go/pkg/mod
      env:
        GOPROXY: https://goproxy.cn,direct
      stages:
        - name: lint
          script: cd src && go vet ./...
        - name: test
          script: cd src && go test -timeout 120s ./...
      failStages:
        - name: pr-check-failed
          script: echo "PR 检查未通过，请修复后重新提交"

# ==================== v* tag: 正式版发布 ====================
"v*":
  tag_push:
    - name: formal-release
      docker:
        image: golang:1.21
        volumes:
          - /go/pkg/mod
      services:
        - docker
      env:
        GOPROXY: https://goproxy.cn,direct
        CGO_ENABLED: "0"
      label:
        type: RELEASE
      stages:
        - name: lint
          script: cd src && go vet ./...
        - name: test
          script: cd src && go test -timeout 120s ./...
        - name: determine-version
          script: |
            VERSION=$(bash scripts/version.sh)
            echo "Version: $VERSION"
            echo "##[set-output version=$VERSION]"
          exports:
            version: BUILD_VERSION
        - name: webui-build
          image: node:20-alpine
          script: |
            cd web && npm install && npm run build
        - name: build
          script: |
            rm -rf src/proxy/webui_dist && mkdir -p src/proxy/webui_dist && cp -r web/dist/* src/proxy/webui_dist/
            bash scripts/ci-build.sh "$BUILD_VERSION"
        - name: verify-release
          script: bash scripts/check-release-files.sh "$BUILD_VERSION"
        - name: generate-changelog
          image: cnbcool/changelog
          settings:
            latestChangeLogTarget: LATEST_CHANGELOG.md
        - name: create-release
          type: git:release
          options:
            title: YiGate
            descriptionFromFile: LATEST_CHANGELOG.md
            latest: true
        - name: upload-artifacts
          image: cnbcool/attachments
          settings:
            path: release/
          allowFailure: true
        # ---- Docker 镜像发布（与二进制产物同时发布）----
        - name: docker-build
          script: |
            docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${BUILD_VERSION} -f deploy/docker/Dockerfile .
        - name: docker-push
          script: |
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${BUILD_VERSION}
