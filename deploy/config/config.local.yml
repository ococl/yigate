# yigate 本机匿名代理模板
# 仅监听回环地址，允许匿名代理访问，适合单机应用和本地开发。
# 对外暴露代理端口前请改用 config.lan.yml 并配置认证。

listen: "127.0.0.1:8891"
users: {}
management: "127.0.0.1:8890"
upstreams: []
routing:
  final: direct
  geosite:
    path: "geosite.dat"
    auto_update: false
destination_policy:
  protect_private: true
  default_action: allow
socks5:
  allow_bind: false
  allow_udp_associate: false
timeouts:
  dial: 10s
  handshake: 10s
  http_exchange: 60s
  tunnel_idle: 5m
log:
  level: info
  format: json
  output: stdout
check_interval: 30
max_connections: 1024
