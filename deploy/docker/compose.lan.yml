services:
  yigate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: yigate:lan
    container_name: yigate-lan
    environment:
      # 认证与密码不通过环境变量注入：在配置文件或 WebUI 中手动配置 management_auth_token 与 users。
    ports:
      - "8891:8891"
      - "127.0.0.1:8890:8890"
    volumes:
      - ../config/config.lan.yml:/etc/yigate/config.lan.yml:ro
      - yigate-data:/var/lib/yigate
      - yigate-logs:/var/log/yigate
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8890/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  yigate-data:
  yigate-logs:
