services:
  yigate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: yigate:lan
    container_name: yigate-lan
    # 认证与密码不通过环境变量注入：在配置文件或 WebUI 中手动配置 management_auth_token 与 users。
    ports:
      - "8891:8891"
      - "127.0.0.1:8890:8890"
    volumes:
      - ./config.lan.yml:/var/lib/yigate/data/config.yml:ro
      - yigate-data:/var/lib/yigate/data
      - yigate-logs:/var/lib/yigate/logs
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN    # 修正挂载目录属主
      - SETGID   # setpriv 降权
      - SETUID   # setpriv 降权
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          setpriv --reuid=1000 --regid=1000 --clear-groups sh -c
          'token=$$(grep "^management_auth_token:" /var/lib/yigate/data/config.yml | head -n 1 | cut -d" " -f2- | cut -d\" -f2);
          wget -q -O /dev/null --header="Authorization: Bearer $$token"
          http://127.0.0.1:8890/health'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  yigate-data:
  yigate-logs:
