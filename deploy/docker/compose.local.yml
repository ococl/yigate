services:
  yigate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: yigate:local
    container_name: yigate-local
    ports:
      - "127.0.0.1:8891:8891"
      - "127.0.0.1:8890:8890"
    volumes:
      - ./config.local.yml:/var/lib/yigate/data/config.yml:ro
      - yigate-data:/var/lib/yigate/data
      - yigate-logs:/var/lib/yigate/logs
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN    # 修正挂载目录属主
      - SETGID   # setpriv 降权
      - SETUID   # setpriv 降权
    restart: unless-stopped
    # 健康检查由镜像内置（Dockerfile HEALTHCHECK，匿名探测 /health），此处不重复定义。

volumes:
  yigate-data:
  yigate-logs:
