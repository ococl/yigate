services:
  k5pw:
    build:
      context: ../src
      dockerfile: Dockerfile
    image: k5pw:latest
    container_name: k5pw
    # host 网络模式：代理服务器需要处理 BIND/UDP 入站连接和本地回环，
    # bridge NAT 会破坏这些场景。host 模式消除 NAT 隔离，性能更优。
    network_mode: host
    volumes:
      - ./k5/config.yml:/etc/k5pw/config.yml:ro
      - ./k5/geosite.dat:/etc/k5pw/geosite.dat:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "-w3", "127.0.0.1", "8891"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
